services:
  - type: web
    name: guardianai-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn guardian.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
