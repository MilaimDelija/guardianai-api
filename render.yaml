services:
  - type: web
    name: vigil-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn guardian.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: VIGIL_API_KEYS
        sync: false
      - key: VIGIL_ENV
        value: production
