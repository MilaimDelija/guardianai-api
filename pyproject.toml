[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vigil"
version = "0.1.0"
description = "Open-source AI security engine for LLMs, agents, and autonomous systems"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Neuronium Engineers", email = "security@neuronium.io" }
]
keywords = [
    "ai-security",
    "llm-security",
    "prompt-injection",
    "jailbreak-detection",
    "ai-safety",
    "agent-security",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://neuronium.io/guardian"
Repository = "https://github.com/neuronium/vigil"
Documentation = "https://docs.neuronium.io/guardian"
"Bug Tracker" = "https://github.com/neuronium/vigil/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
