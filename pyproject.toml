[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardianai"
version = "1.0.0"
description = "GuardianAI — The Security Layer for AI Systems"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [
    { name = "Neuronium Engineers", email = "contact@neuronium.engineer" }
]
keywords = [
    "ai-security", "llm-security", "prompt-injection",
    "jailbreak-detection", "ai-safety", "agent-security",
    "deepfake-detection", "guardianai",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic[email]>=2.0.0",
    "groq>=0.9.0",
    "psycopg2-binary>=2.9.0",
    "resend>=0.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.urls]
Homepage = "https://guardianai-self.vercel.app"
Repository = "https://github.com/MilaimDelija/guardianai-api"

[tool.setuptools.packages.find]
where = ["."]
include = ["guardian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
